<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillLab PH Teacher Dashboard</title>
<style>
:root{--bg:#07111f;--panel:#0d1a2b;--card:#101f33;--line:#28405e;--text:#f4f7fb;--muted:#91a7c0;--accent:#28d7a0;--accent2:#67e8f9;--warn:#f6c85f;--bad:#ff8b8b}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,#173b5e,transparent 34%),var(--bg);color:var(--text);font:15px Inter,system-ui,-apple-system,Segoe UI,sans-serif}
.wrap{width:min(1120px,calc(100% - 24px));margin:auto;padding:22px 0 60px}.top,.row{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.brandline{display:flex;gap:12px;align-items:center}.logo{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#032018;font-weight:950}
.brand{font-size:26px;font-weight:900}.muted{color:var(--muted)}.ey{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:800}.ok{color:#baffea}.warn{color:#ffe2a2}.bad{color:#ffb8b8}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.card{border:1px solid var(--line);background:rgba(16,31,51,.95);border-radius:17px;padding:18px}.hero{padding:24px}.hero h1{font-size:31px;line-height:1.08;margin:6px 0 8px}
.metric b{font-size:23px;display:block;margin:5px 0}.form{display:grid;gap:12px}label{display:grid;gap:6px;font-size:12px;font-weight:700}
input,select,textarea{width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;background:#081421;color:var(--text);padding:0 12px;font-size:16px}textarea{min-height:78px;padding:10px 12px}
.btn{min-height:44px;border:1px solid var(--line);border-radius:11px;background:var(--panel);color:var(--text);padding:0 15px;font-weight:800;cursor:pointer}.btn.primary{background:var(--accent);border-color:var(--accent);color:#032018}.btn:disabled{opacity:.5}
.notice{border:1px solid #4e6d8f;background:#0a1727;border-radius:12px;padding:12px}.table{overflow:auto}table{border-collapse:collapse;width:100%;min-width:800px}th,td{padding:11px 7px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}th{font-size:11px;color:var(--muted);text-transform:uppercase}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.toolbar select{width:auto;min-width:190px}.pill{display:inline-block;border:1px solid #2d846e;background:rgba(40,215,160,.08);color:#baffea;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:800}
.spin{display:inline-block;width:15px;height:15px;border:2px solid #58718d;border-top-color:var(--accent);border-radius:50%;animation:s .7s linear infinite;margin-right:7px;vertical-align:-3px}@keyframes s{to{transform:rotate(360deg)}}
.progress{height:8px;background:#081421;border-radius:999px;overflow:hidden}.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
@media(max-width:850px){.g2,.g3,.g4{grid-template-columns:1fr}.toolbar select{width:100%}.hero h1{font-size:25px}}
</style></head>
<body><div class="wrap"><header class="top"><div class="brandline"><div class="logo">SL</div><div><div class="ey ok">TEACHER DASHBOARD</div><div class="brand">SkillLab PH</div><div class="muted">Computer Systems Servicing</div></div></div></header><main id="app" class="grid" style="margin-top:20px"></main></div>
<script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/+esm';
const U='https://pejqnbqxfodjlmgtdnxh.supabase.co',K='sb_publishable_n6E-3o4y6-fN7HGk85sPWw_HJc7Kl08',API=U+'/functions/v1/skilllab-app';
const sb=createClient(U,K),app=document.querySelector('#app');let classes=[],classId=null,catalog=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const showName=s=>String(s||'').replace(/\s·\s[0-9a-f]{8}$/i,'');
const fmt=s=>s==null?'—':Number(s)<60?`${Number(s)}s`:`${Math.floor(Number(s)/60)}m ${Number(s)%60}s`;
async function getCatalog(){const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'catalog'})});const x=await r.json();return x.activities||[]}
function login(){app.innerHTML=`<div class="grid g2"><article class="card hero"><div class="ey">TEACHER ACCOUNT</div><h1>Manage your SkillLab class.</h1><p class="muted">Teacher accounts are sign-in only. Student registration is handled on the Student portal.</p></article><form id="auth" class="card form"><label>Email<input id="em" type="email" autocomplete="username" required></label><label>Password<input id="pw" type="password" autocomplete="current-password" minlength="6" required></label><div id="msg" class="muted"></div><button class="btn primary">Sign in</button></form></div>`;document.querySelector('#auth').onsubmit=async e=>{e.preventDefault();const m=document.querySelector('#msg');m.innerHTML='<span class="spin"></span>Signing in…';const{error}=await sb.auth.signInWithPassword({email:document.querySelector('#em').value.trim(),password:document.querySelector('#pw').value});if(error){m.innerHTML='<span class="bad">'+esc(error.message)+'</span>';return}load()}}
async function load(){const{data:{session}}=await sb.auth.getSession();if(!session)return login();app.innerHTML='<div class="card"><span class="spin"></span>Loading teacher dashboard…</div>';catalog=await getCatalog();const c=await sb.from('classes').select('id,name,code,is_active,expected_students,created_at').order('created_at',{ascending:false});classes=c.data||[];if(!classId&&classes[0])classId=classes[0].id;const cur=classes.find(x=>x.id===classId)||classes[0];if(!cur)return emptyClass(session.user);
const [ar,fr]=await Promise.all([sb.from('attempts').select('student_name,score,mastery,efficiency,steps_count,duration_seconds,created_at,activities(title,slug)').eq('class_id',cur.id).order('created_at',{ascending:false}).limit(5000),sb.from('pilot_feedback').select('clarity,note,created_at').eq('class_id',cur.id).limit(5000)]);
const attempts=ar.data||[],feedback=fr.data||[],byStudent=new Map(),names=new Map();
attempts.forEach(x=>{const k=(x.student_name||'').toLowerCase();if(!k)return;if(!byStudent.has(k))byStudent.set(k,new Map());const slug=x.activities?.slug||'';const m=byStudent.get(k);m.set(slug,Math.max(m.get(slug)||0,Number(x.score||0)));if(!names.has(k))names.set(k,showName(x.student_name))});
const roster=[...byStudent].map(([k,m])=>({name:names.get(k),scores:m,complete:catalog.length&&catalog.every(a=>(m.get(a.slug)||0)>=90)})).sort((a,b)=>a.name.localeCompare(b.name));
const visibleBest=[];for(const [k,m] of byStudent)for(const [slug,score] of m)visibleBest.push(score);const avg=visibleBest.length?Math.round(visibleBest.reduce((q,x)=>q+x,0)/visibleBest.length):0,complete=roster.filter(x=>x.complete).length,expected=cur.expected_students||15;
app.innerHTML=`<div class="row"><div><div class="ey">TEACHER DASHBOARD</div><h2>${esc(cur.name)}</h2><div class="muted">Code ${esc(cur.code)} · pass requirement 90/100</div></div><div class="toolbar"><select id="classpick">${classes.map(x=>`<option value="${x.id}" ${x.id===cur.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select><button id="new" class="btn">New class</button><button id="pause" class="btn">${cur.is_active?'Pause class':'Activate class'}</button><button id="out" class="btn">Sign out</button></div></div><div class="grid g4"><div class="card metric"><span class="muted">Participation</span><b>${roster.length}/${expected}</b></div><div class="card metric"><span class="muted">All 10 passed ≥90</span><b>${complete}/${expected}</b></div><div class="card metric"><span class="muted">Average best score</span><b>${avg}%</b></div><div class="card metric"><span class="muted">Feedback</span><b>${feedback.length}</b></div></div><article class="card"><div class="ey">10-LAB STUDENT PROGRESS</div>${roster.length?`<div class="table"><table><thead><tr><th>Student</th>${catalog.map((a,i)=>`<th>${i+1}</th>`).join('')}<th>Status</th></tr></thead><tbody>${roster.map(r=>`<tr><td><b>${esc(r.name)}</b></td>${catalog.map(a=>{const s=r.scores.get(a.slug)||0;return`<td class="${s>=90?'ok':s?'warn':''}">${s||'—'}</td>`}).join('')}<td class="${r.complete?'ok':'warn'}">${r.complete?'Complete':'In progress'}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">No student attempts yet.</p>'}</article><article class="card table"><div class="ey">ATTEMPT HISTORY</div><table><thead><tr><th>Student</th><th>Activity</th><th>Score</th><th>Mastery</th><th>Efficiency</th><th>Time</th><th>Submitted</th></tr></thead><tbody>${attempts.map(x=>`<tr><td><b>${esc(showName(x.student_name))}</b></td><td>${esc(x.activities?.title)}</td><td>${x.score}</td><td>${esc(x.mastery)}</td><td>${x.efficiency}%</td><td>${fmt(x.duration_seconds)}</td><td>${new Date(x.created_at).toLocaleString('en-PH')}</td></tr>`).join('')}</tbody></table></article>`;
document.querySelector('#classpick').onchange=e=>{classId=e.target.value;load()};document.querySelector('#out').onclick=async()=>{await sb.auth.signOut();classId=null;login()};document.querySelector('#pause').onclick=async()=>{const{error}=await sb.from('classes').update({is_active:!cur.is_active}).eq('id',cur.id);if(error)return alert(error.message);load()};document.querySelector('#new').onclick=()=>newClass(session.user)}
function emptyClass(user){app.innerHTML=`<article class="card hero"><div class="ey">NO CLASS YET</div><h1>Create your first SkillLab class.</h1></article><button id="new" class="btn primary">Create class</button><button id="out" class="btn">Sign out</button>`;document.querySelector('#new').onclick=()=>newClass(user);document.querySelector('#out').onclick=async()=>{await sb.auth.signOut();login()}}
function newClass(user){app.innerHTML=`<form id="mk" class="card form"><div class="ey">NEW CLASS</div><label>Class name<input id="cn" value="Grade 12 CSS - Pilot" required></label><label>Class code<input id="cc" value="CSSP01" minlength="4" maxlength="8" required></label><label>Expected students<input id="ce" type="number" value="15" min="1" max="100"></label><button class="btn primary">Create class</button><button type="button" id="back" class="btn">Back</button></form>`;document.querySelector('#back').onclick=load;document.querySelector('#mk').onsubmit=async e=>{e.preventDefault();const{data,error}=await sb.from('classes').insert({owner_id:user.id,name:document.querySelector('#cn').value.trim(),code:document.querySelector('#cc').value.trim().toUpperCase(),expected_students:Number(document.querySelector('#ce').value)}).select('id').single();if(error)return alert(error.message);classId=data.id;load()}}
load();
</script></body></html>
