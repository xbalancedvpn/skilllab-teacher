<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillLab PH Teacher Dashboard</title>
<style>
:root{--bg:#07111f;--panel:#0d1a2b;--card:#101f33;--line:#28405e;--text:#f4f7fb;--muted:#91a7c0;--accent:#28d7a0;--accent2:#67e8f9;--warn:#f6c85f;--bad:#ff8b8b}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,#173b5e,transparent 34%),var(--bg);color:var(--text);font:15px Inter,system-ui,-apple-system,Segoe UI,sans-serif}
.wrap{width:min(1120px,calc(100% - 24px));margin:auto;padding:22px 0 60px}.top,.row{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.brandline{display:flex;gap:12px;align-items:center}.logo{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#032018;font-weight:950}
.brand{font-size:26px;font-weight:900}.muted{color:var(--muted)}.ey{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:800}.ok{color:#baffea}.warn{color:#ffe2a2}.bad{color:#ffb8b8}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.card{border:1px solid var(--line);background:rgba(16,31,51,.95);border-radius:17px;padding:18px}.hero{padding:24px}.hero h1{font-size:31px;line-height:1.08;margin:6px 0 8px}
.metric b{font-size:23px;display:block;margin:5px 0}.form{display:grid;gap:12px}label{display:grid;gap:6px;font-size:12px;font-weight:700}
input,select,textarea{width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;background:#081421;color:var(--text);padding:0 12px;font-size:16px}textarea{min-height:78px;padding:10px 12px}
.btn{min-height:44px;border:1px solid var(--line);border-radius:11px;background:var(--panel);color:var(--text);padding:0 15px;font-weight:800;cursor:pointer}.btn.primary{background:var(--accent);border-color:var(--accent);color:#032018}.btn:disabled{opacity:.5}
.notice{border:1px solid #4e6d8f;background:#0a1727;border-radius:12px;padding:12px}.table{overflow:auto}table{border-collapse:collapse;width:100%;min-width:800px}th,td{padding:11px 7px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}th{font-size:11px;color:var(--muted);text-transform:uppercase}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.toolbar select{width:auto;min-width:190px}.pill{display:inline-block;border:1px solid #2d846e;background:rgba(40,215,160,.08);color:#baffea;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:800}
.spin{display:inline-block;width:15px;height:15px;border:2px solid #58718d;border-top-color:var(--accent);border-radius:50%;animation:s .7s linear infinite;margin-right:7px;vertical-align:-3px}@keyframes s{to{transform:rotate(360deg)}}
.progress{height:8px;background:#081421;border-radius:999px;overflow:hidden}.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
@media(max-width:850px){.g2,.g3,.g4{grid-template-columns:1fr}.toolbar select{width:100%}.hero h1{font-size:25px}}
@media print{body{background:#fff;color:#111}.wrap{width:100%;padding:0}.card{background:#fff;color:#111;border-color:#ccc;break-inside:avoid}.muted,.ey,th{color:#555}.no-print{display:none!important}.table{overflow:visible}table{min-width:0}th,td{color:#111;border-color:#ddd}.ok,.warn,.bad{color:#111}}
</style></head>
<body><div class="wrap"><header class="top"><div class="brandline"><div class="logo">SL</div><div><div class="ey ok">TEACHER DASHBOARD</div><div class="brand">SkillLab PH</div><div class="muted">Computer Systems Servicing</div></div></div></header><main id="app" class="grid" style="margin-top:20px"></main></div>
<script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/+esm';
const U='https://pejqnbqxfodjlmgtdnxh.supabase.co',K='sb_publishable_n6E-3o4y6-fN7HGk85sPWw_HJc7Kl08',API=U+'/functions/v1/skilllab-app';
const sb=createClient(U,K),app=document.querySelector('#app');let classes=[],classId=null,catalog=[],discussionSlug=null,discussionAnon=false;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const showName=s=>String(s||'').replace(/\s·\s[0-9a-f]{8}$/i,'').trim().toUpperCase();
const fmt=s=>s==null?'—':Number(s)<60?`${Number(s)}s`:`${Math.floor(Number(s)/60)}m ${Number(s)%60}s`;
const avgNums=a=>a.length?Math.round(a.reduce((q,x)=>q+Number(x||0),0)/a.length):0;
const pct=(a,b)=>b?Math.round((a/b)*100):0;
const csvCell=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
const prettyKey=s=>String(s||'').replace(/_/g,' ').replace(/\b\w/g,m=>m.toUpperCase());
const anonName=(name,i)=>discussionAnon?`STUDENT ${String(i+1).padStart(2,'0')}`:name;
async function fetchAttempts(id){let all=[],from=0;for(;;){const r=await sb.from('attempts').select('student_name,scenario_key,diagnosis_key,repair_key,score,mastery,efficiency,steps_count,duration_seconds,created_at,activities(title,slug)').eq('class_id',id).order('created_at',{ascending:false}).range(from,from+999);if(r.error)return r;all.push(...(r.data||[]));if((r.data||[]).length<1000)return{data:all,error:null};from+=1000}}
async function fetchFeedback(id){let all=[],from=0;for(;;){const r=await sb.from('pilot_feedback').select('student_name,clarity,note,created_at').eq('class_id',id).order('created_at',{ascending:false}).range(from,from+999);if(r.error)return r;all.push(...(r.data||[]));if((r.data||[]).length<1000)return{data:all,error:null};from+=1000}}
async function fetchSessions(id){let all=[],from=0;for(;;){const r=await sb.from('simulation_sessions').select('student_name,scenario_key,actions,status,started_at,completed_at,activities(title,slug)').eq('class_id',id).order('started_at',{ascending:false}).range(from,from+999);if(r.error)return r;all.push(...(r.data||[]));if((r.data||[]).length<1000)return{data:all,error:null};from+=1000}}
async function getCatalog(){const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'catalog'})});const x=await r.json();return x.activities||[]}
function login(){app.innerHTML=`<div class="grid g2"><article class="card hero"><div class="ey">TEACHER ACCOUNT</div><h1>Manage your SkillLab class.</h1><p class="muted">Teacher accounts are sign-in only. Student registration is handled on the Student portal.</p></article><form id="auth" class="card form"><label>Email<input id="em" type="email" autocomplete="username" required></label><label>Password<input id="pw" type="password" autocomplete="current-password" minlength="6" required></label><div id="msg" class="muted"></div><button class="btn primary">Sign in</button></form></div>`;document.querySelector('#auth').onsubmit=async e=>{e.preventDefault();const m=document.querySelector('#msg');m.innerHTML='<span class="spin"></span>Signing in…';const{error}=await sb.auth.signInWithPassword({email:document.querySelector('#em').value.trim(),password:document.querySelector('#pw').value});if(error){m.innerHTML='<span class="bad">'+esc(error.message)+'</span>';return}load()}}
async function load(){const{data:{session}}=await sb.auth.getSession();if(!session)return login();app.innerHTML='<div class="card"><span class="spin"></span>Loading teacher dashboard…</div>';catalog=await getCatalog();const c=await sb.from('classes').select('id,name,code,is_active,expected_students,created_at').order('created_at',{ascending:false});classes=c.data||[];if(!classId&&classes[0])classId=classes[0].id;const cur=classes.find(x=>x.id===classId)||classes[0];if(!cur){await sb.auth.signOut();return login('This account is not authorized as a SkillLab teacher.')}
const [ar,fr,mr,sr]=await Promise.all([fetchAttempts(cur.id),fetchFeedback(cur.id),sb.from('class_members').select('user_id,student_name,display_name,status,is_test,teacher_notes,joined_at').eq('class_id',cur.id).order('joined_at',{ascending:true}),fetchSessions(cur.id)]);
const allAttempts=ar.data||[],allFeedback=fr.data||[],members=mr.data||[],allSessions=sr.data||[],reportMembers=members.filter(x=>(x.status||'active')==='active'&&!x.is_test),managedRoster=members.length>0,reportKeys=new Set(reportMembers.map(x=>(x.student_name||'').trim().toLowerCase())),attempts=managedRoster?allAttempts.filter(x=>reportKeys.has((x.student_name||'').trim().toLowerCase())):allAttempts,feedback=managedRoster?allFeedback.filter(x=>reportKeys.has((x.student_name||'').trim().toLowerCase())):allFeedback,sessions=managedRoster?allSessions.filter(x=>reportKeys.has((x.student_name||'').trim().toLowerCase())):allSessions,byStudent=new Map(),names=new Map(),studentAttempts=new Map();
attempts.forEach(x=>{const k=(x.student_name||'').trim().toLowerCase();if(!k)return;if(!byStudent.has(k))byStudent.set(k,new Map());if(!studentAttempts.has(k))studentAttempts.set(k,[]);studentAttempts.get(k).push(x);const slug=x.activities?.slug||'';if(slug){const m=byStudent.get(k);m.set(slug,Math.max(m.get(slug)||0,Number(x.score||0)))}if(!names.has(k))names.set(k,showName(x.student_name))});
const memberKeys=new Set(members.map(x=>(x.student_name||'').trim().toLowerCase()));
reportMembers.forEach(x=>{const k=(x.student_name||'').trim().toLowerCase();if(!k)return;if(!byStudent.has(k))byStudent.set(k,new Map());if(!names.has(k))names.set(k,String(x.display_name||showName(x.student_name)).trim().toUpperCase())});
const roster=[...byStudent].map(([k,m])=>{const rows=studentAttempts.get(k)||[],best=[...m.values()],passed=best.filter(x=>x>=90).length,member=members.find(x=>(x.student_name||'').trim().toLowerCase()===k);return{key:k,name:names.get(k)||showName(k),scores:m,labs:m.size,passed,attempts:rows.length,retakes:Math.max(0,rows.length-m.size),avgBest:avgNums(best),latest:rows[0]?.created_at||'',joined:member?.joined_at||'',status:rows.length?'In progress':'Not started',complete:catalog.length&&catalog.every(a=>(m.get(a.slug)||0)>=90)}}).map(r=>({...r,status:r.complete?'Complete':r.status})).sort((a,b)=>a.name.localeCompare(b.name));
const visibleBest=[];for(const [,m] of byStudent)for(const [,score] of m)visibleBest.push(score);
const avg=avgNums(visibleBest),complete=roster.filter(x=>x.complete).length,expected=cur.expected_students||15,notStarted=roster.filter(x=>!x.attempts).length,totalAttempts=attempts.length,retakes=roster.reduce((q,x)=>q+x.retakes,0),passAttempts=attempts.filter(x=>Number(x.score||0)>=90).length,unmapped=attempts.filter(x=>!x.activities?.slug).length;
const labStats=catalog.map((a,i)=>{const rows=attempts.filter(x=>x.activities?.slug===a.slug),best=new Map();rows.forEach(x=>{const k=(x.student_name||'').trim().toLowerCase();if(k)best.set(k,Math.max(best.get(k)||0,Number(x.score||0)))});const students=best.size,passed=[...best.values()].filter(x=>x>=90).length,durations=rows.map(x=>x.duration_seconds).filter(x=>x!=null),effs=rows.map(x=>x.efficiency).filter(x=>x!=null);return{n:i+1,title:a.title,students,attempts:rows.length,retakes:Math.max(0,rows.length-students),passed,passRate:pct(passed,students),avgScore:avgNums(rows.map(x=>x.score)),avgTime:durations.length?Math.round(durations.reduce((q,x)=>q+Number(x),0)/durations.length):null,avgEff:avgNums(effs)}});
if(!discussionSlug||!catalog.some(a=>a.slug===discussionSlug))discussionSlug=catalog[0]?.slug||null;
const discussionActivity=catalog.find(a=>a.slug===discussionSlug)||catalog[0]||null;
const simRows=discussionActivity?attempts.filter(x=>x.activities?.slug===discussionActivity.slug):[];
const simSessions=discussionActivity?sessions.filter(x=>x.activities?.slug===discussionActivity.slug):[];
const simByStudent=new Map();
simRows.slice().sort((a,b)=>new Date(a.created_at)-new Date(b.created_at)).forEach(x=>{const k=(x.student_name||'').trim().toLowerCase();if(!k)return;if(!simByStudent.has(k))simByStudent.set(k,[]);simByStudent.get(k).push(x)});
const simStudents=[...simByStudent.entries()].map(([k,rows])=>{const passAt=rows.findIndex(x=>Number(x.score)>=90),passRows=rows.filter(x=>Number(x.score)>=90),best=Math.max(...rows.map(x=>Number(x.score||0))),first=Number(rows[0]?.score||0),bestPass=passRows.slice().sort((a,b)=>Number(b.score)-Number(a.score)||Number(a.duration_seconds||999999)-Number(b.duration_seconds||999999))[0]||null;return{k,name:showName(rows[0]?.student_name),rows,attempts:rows.length,triesToMastery:passAt>=0?passAt+1:null,passed:passAt>=0,best,first,improvement:best-first,bestPass}});
const successfulAttempts=simRows.filter(x=>Number(x.score)>=90);
const fastest=successfulAttempts.slice().filter(x=>x.duration_seconds!=null).sort((a,b)=>Number(a.duration_seconds)-Number(b.duration_seconds)||Number(b.score)-Number(a.score))[0]||null;
const mostEff=successfulAttempts.slice().sort((a,b)=>Number(b.efficiency)-Number(a.efficiency)||Number(a.steps_count)-Number(b.steps_count)||Number(a.duration_seconds||999999)-Number(b.duration_seconds||999999))[0]||null;
const masteryStudents=simStudents.filter(x=>x.triesToMastery!=null);
const minTries=masteryStudents.length?Math.min(...masteryStudents.map(x=>x.triesToMastery)):null;
const fewest=minTries==null?[]:simStudents.filter(x=>x.triesToMastery===minTries);
const improved=simStudents.filter(x=>x.attempts>1).sort((a,b)=>b.improvement-a.improvement||b.best-a.best)[0]||null;
const firstTry=simStudents.filter(x=>x.triesToMastery===1);
const persistent=masteryStudents.slice().sort((a,b)=>b.triesToMastery-a.triesToMastery)[0]||null;
const needsReview=simStudents.filter(x=>!x.passed).sort((a,b)=>b.attempts-a.attempts||a.best-b.best);
const countKeys=(rows,key,wrongOnly=false)=>{const m=new Map();rows.forEach(x=>{if(wrongOnly&&x[key]===x.scenario_key)return;const v=x[key];if(v)m.set(v,(m.get(v)||0)+1)});return[...m.entries()].sort((a,b)=>b[1]-a[1])};
const wrongDiag=countKeys(simRows,'diagnosis_key',true),wrongRepair=countKeys(simRows,'repair_key',true);
const actionPaths=new Map();simSessions.filter(x=>Array.isArray(x.actions)&&x.actions.length).forEach(x=>{const p=x.actions.map(prettyKey).join(' → ');actionPaths.set(p,(actionPaths.get(p)||0)+1)});
const commonPaths=[...actionPaths.entries()].sort((a,b)=>b[1]-a[1]).slice(0,3);
const discussionPass=simStudents.filter(x=>x.passed).length;
const discussionAvgAttempts=simStudents.length?Math.round((simStudents.reduce((q,x)=>q+x.attempts,0)/simStudents.length)*10)/10:0;
const displayStudentName=raw=>{const n=showName(raw),idx=simStudents.findIndex(x=>x.name===n);return anonName(n,Math.max(0,idx))};
const discussionQuestion=wrongDiag[0]?`Why did several students choose "${prettyKey(wrongDiag[0][0])}"? What evidence should be checked before making that diagnosis?`:`What evidence helped you isolate the fault in ${discussionActivity?.title||'this simulator'} efficiently?`;
const clarity={clear:0,somewhat_confusing:0,confusing:0};feedback.forEach(x=>{if(x.clarity in clarity)clarity[x.clarity]++});const notes=feedback.filter(x=>String(x.note||'').trim());
app.innerHTML=`<div class="row"><div><div class="ey">TEACHER DASHBOARD</div><h2>${esc(cur.name)}</h2><div class="muted">Code ${esc(cur.code)} · pass requirement 90/100</div></div><div class="toolbar no-print"><select id="classpick">${classes.map(x=>`<option value="${x.id}" ${x.id===cur.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select><button id="print" class="btn">Print / Save PDF</button><button id="csv" class="btn">Export CSV</button><button id="classreport" class="btn primary">Class Report</button><button id="manage" class="btn">Manage Students</button><button id="new" class="btn">New class</button><button id="pause" class="btn">${cur.is_active?'Pause class':'Activate class'}</button><button id="out" class="btn">Sign out</button></div></div>
<div class="grid g4"><div class="card metric"><span class="muted">Participation</span><b>${roster.length}/${expected}</b><small class="muted">${Math.max(0,expected-roster.length)} expected student(s) not yet seen</small></div><div class="card metric"><span class="muted">Course complete</span><b>${complete}/${expected}</b></div><div class="card metric"><span class="muted">Stored attempts</span><b>${totalAttempts}</b></div><div class="card metric"><span class="muted">Average best score</span><b>${avg}%</b></div></div>
<div class="grid g4"><div class="card metric"><span class="muted">Not started</span><b>${notStarted}</b></div><div class="card metric"><span class="muted">Retakes</span><b>${retakes}</b></div><div class="card metric"><span class="muted">Passing attempts</span><b>${passAttempts}</b></div><div class="card metric"><span class="muted">Feedback</span><b>${feedback.length}</b></div></div>
${unmapped?`<div class="notice warn"><b>Reporting check:</b> ${unmapped} stored attempt(s) could not be matched to a simulator. Those attempts are still listed in Attempt History, but they cannot be placed into the 10-lab matrix until the activity relationship is available.</div>`:''}
<article class="card"><div class="ey">10-LAB STUDENT PROGRESS</div>${roster.length?`<div class="table"><table><thead><tr><th>Student</th>${catalog.map((a,i)=>`<th title="${esc(a.title)}">${i+1}</th>`).join('')}<th>Status</th></tr></thead><tbody>${roster.map(r=>`<tr><td><b>${esc(r.name)}</b></td>${catalog.map(a=>{const s=r.scores.get(a.slug)||0;return`<td class="${s>=90?'ok':s?'warn':''}">${s||'—'}</td>`}).join('')}<td class="${r.complete?'ok':r.attempts?'warn':'muted'}">${r.status}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">No student attempts yet.</p>'}</article>
<article class="card"><div class="ey">STUDENT SUMMARY</div>${roster.length?`<div class="table"><table><thead><tr><th>Student</th><th>Labs attempted</th><th>Labs passed</th><th>Total attempts</th><th>Retakes</th><th>Average best</th><th>Joined</th><th>Latest activity</th><th>Status</th></tr></thead><tbody>${roster.map(r=>`<tr><td><b>${esc(r.name)}</b></td><td>${r.labs}/${catalog.length}</td><td>${r.passed}/${catalog.length}</td><td>${r.attempts}</td><td>${r.retakes}</td><td>${r.avgBest}%</td><td>${r.joined?new Date(r.joined).toLocaleString('en-PH'):'—'}</td><td>${r.latest?new Date(r.latest).toLocaleString('en-PH'):'—'}</td><td class="${r.complete?'ok':r.attempts?'warn':'muted'}">${r.status}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">No student attempts yet.</p>'}</article>
<article id="discussion-report" class="card"><div class="row"><div><div class="ey">SIMULATION DISCUSSION REPORT</div><h3 style="margin:6px 0 0">${esc(discussionActivity?.title||'No simulator')}</h3></div><div class="toolbar no-print"><select id="simpick">${catalog.map((a,i)=>`<option value="${a.slug}" ${a.slug===discussionSlug?'selected':''}>${String(i+1).padStart(2,'0')} · ${esc(a.title)}</option>`).join('')}</select><button id="anon" class="btn">${discussionAnon?'Show Names':'Hide Names'}</button><button id="project" class="btn">Discussion Mode</button><button id="simprint" class="btn">Print This Report</button><button id="simcsv" class="btn">Export Simulation CSV</button></div></div>
<div class="grid g4" style="margin-top:14px"><div class="card metric"><span class="muted">Students attempted</span><b>${simStudents.length}</b></div><div class="card metric"><span class="muted">Mastered ≥90</span><b>${discussionPass}</b><small class="muted">${pct(discussionPass,simStudents.length)}% pass rate</small></div><div class="card metric"><span class="muted">Total attempts</span><b>${simRows.length}</b></div><div class="card metric"><span class="muted">Avg attempts / student</span><b>${discussionAvgAttempts}</b></div></div>
<div class="grid g3" style="margin-top:14px">
<div class="notice"><div class="ey">FASTEST SUCCESSFUL MASTERY</div>${fastest?`<b>${esc(displayStudentName(fastest.student_name))}</b><br>${fmt(fastest.duration_seconds)} · ${fastest.score}% score · ${fastest.efficiency}% efficiency · ${fastest.steps_count} steps`:'<span class="muted">No passing attempt yet.</span>'}</div>
<div class="notice"><div class="ey">HIGHEST EFFICIENCY</div>${mostEff?`<b>${esc(displayStudentName(mostEff.student_name))}</b><br>${mostEff.efficiency}% efficiency · ${mostEff.score}% score · ${mostEff.steps_count} steps · ${fmt(mostEff.duration_seconds)}`:'<span class="muted">No passing attempt yet.</span>'}</div>
<div class="notice"><div class="ey">FEWEST TRIES TO MASTERY</div>${fewest.length?`<b>${fewest.map(x=>esc(anonName(x.name,simStudents.indexOf(x)))).join(', ')}</b><br>${minTries} attempt${minTries===1?'':'s'} to reach 90+`:'<span class="muted">No mastery yet.</span>'}</div>
</div>
<div class="grid g3" style="margin-top:14px">
<div class="notice"><div class="ey">FIRST-TRY MASTERY</div><b>${firstTry.length}</b><br><span class="muted">${firstTry.length?firstTry.map(x=>esc(anonName(x.name,simStudents.indexOf(x)))).join(', '):'None yet'}</span></div>
<div class="notice"><div class="ey">MOST IMPROVED</div>${improved?`<b>${esc(anonName(improved.name,simStudents.indexOf(improved)))}</b><br>${improved.first}% → ${improved.best}% · +${improved.improvement} points`:'<span class="muted">Needs at least two attempts.</span>'}</div>
<div class="notice"><div class="ey">PERSISTENCE TO MASTERY</div>${persistent?`<b>${esc(anonName(persistent.name,simStudents.indexOf(persistent)))}</b><br>Mastered after ${persistent.triesToMastery} attempt${persistent.triesToMastery===1?'':'s'}`:'<span class="muted">No mastery data yet.</span>'}</div>

function classReport(cur,source){
  let from='',to='',anonymous=false;
  const members=(source.members||[]).filter(x=>(x.status||'active')==='active'&&!x.is_test);
  const nameMap=new Map(members.map(x=>[(x.student_name||'').trim().toLowerCase(),String(x.display_name||showName(x.student_name)).trim().toUpperCase()]));
  const orderedKeys=members.map(x=>(x.student_name||'').trim().toLowerCase()).filter(Boolean);
  const anonMap=new Map(orderedKeys.map((k,i)=>[k,`STUDENT ${String(i+1).padStart(2,'0')}`]));
  const studentLabel=(k)=>anonymous?(anonMap.get(k)||'STUDENT'):(nameMap.get(k)||showName(k));
  const avg=a=>a.length?Math.round(a.reduce((q,x)=>q+Number(x||0),0)/a.length):0;
  const avg1=a=>a.length?Math.round((a.reduce((q,x)=>q+Number(x||0),0)/a.length)*10)/10:0;
  const within=(ts)=>{
    if(!ts)return true;
    const d=new Date(ts);
    if(from&&d<new Date(from+'T00:00:00'))return false;
    if(to&&d>new Date(to+'T23:59:59.999'))return false;
    return true;
  };
  const render=()=>{
    const attempts=(source.attempts||[]).filter(x=>within(x.created_at));
    const sessions=(source.sessions||[]).filter(x=>within(x.started_at));
    const feedback=(source.feedback||[]).filter(x=>within(x.created_at));
    const byKey=new Map();
    members.forEach(m=>byKey.set((m.student_name||'').trim().toLowerCase(),new Map()));
    attempts.slice().sort((a,b)=>new Date(a.created_at)-new Date(b.created_at)).forEach(x=>{
      const k=(x.student_name||'').trim().toLowerCase(),slug=x.activities?.slug||'';
      if(!byKey.has(k)||!slug)return;
      const labs=byKey.get(k);if(!labs.has(slug))labs.set(slug,[]);labs.get(slug).push(x);
    });
    const studentStats=orderedKeys.map(k=>{
      const labs=byKey.get(k)||new Map();
      const detail=catalog.map(a=>{
        const rows=(labs.get(a.slug)||[]).slice().sort((x,y)=>new Date(x.created_at)-new Date(y.created_at));
        const best=rows.length?Math.max(...rows.map(x=>Number(x.score||0))):0;
        const passIndex=rows.findIndex(x=>Number(x.score)>=90);
        const passRow=passIndex>=0?rows[passIndex]:null;
        return{slug:a.slug,title:a.title,rows,best,first:Number(rows[0]?.score||0),passed:passIndex>=0,tries:passIndex>=0?passIndex+1:null,firstTry:passIndex===0,passRow};
      });
      const attempted=detail.filter(x=>x.rows.length),passed=detail.filter(x=>x.passed);
      const successRows=passed.map(x=>x.passRow).filter(Boolean);
      const improvements=attempted.map(x=>Math.max(0,x.best-x.first));
      return{k,name:studentLabel(k),detail,attempted:attempted.length,passed:passed.length,totalAttempts:attempted.reduce((q,x)=>q+x.rows.length,0),retakes:attempted.reduce((q,x)=>q+Math.max(0,x.rows.length-1),0),avgBest:avg(attempted.map(x=>x.best)),avgEff:avg(successRows.map(x=>x.efficiency)),avgTime:avg(successRows.map(x=>x.duration_seconds)),firstTry:detail.filter(x=>x.firstTry).length,improvement:improvements.reduce((q,x)=>q+x,0),persistence:detail.filter(x=>x.tries&&x.tries>1).reduce((q,x)=>q+(x.tries-1),0),complete:passed.length===catalog.length,status:attempted.length?(passed.length===catalog.length?'Complete':'In Progress'):'Not Started'};
    });
    const labStats=catalog.map((a,i)=>{
      const rows=attempts.filter(x=>x.activities?.slug===a.slug);
      const grouped=new Map();
      rows.slice().sort((x,y)=>new Date(x.created_at)-new Date(y.created_at)).forEach(x=>{const k=(x.student_name||'').trim().toLowerCase();if(!grouped.has(k))grouped.set(k,[]);grouped.get(k).push(x)});
      const stud=[...grouped.values()].map(rs=>{const best=Math.max(...rs.map(x=>Number(x.score||0))),pi=rs.findIndex(x=>Number(x.score)>=90),pr=pi>=0?rs[pi]:null;return{rows:rs,best,passed:pi>=0,tries:pi>=0?pi+1:null,passRow:pr}});
      const passed=stud.filter(x=>x.passed),passRate=pct(passed.length,stud.length),successRows=passed.map(x=>x.passRow).filter(Boolean);
      return{n:i+1,slug:a.slug,title:a.title,competency:a.competency||'',students:stud.length,passed:passed.length,passRate,attempts:rows.length,retakes:stud.reduce((q,x)=>q+Math.max(0,x.rows.length-1),0),avgBest:avg(stud.map(x=>x.best)),avgAttempts:avg1(stud.map(x=>x.rows.length)),avgTime:avg(successRows.map(x=>x.duration_seconds)),avgEff:avg(successRows.map(x=>x.efficiency)),band:passRate>=90?'Strong Mastery':passRate>=70?'Developing Mastery':'Needs Reinforcement'};
    });
    const attemptedLabs=studentStats.reduce((q,s)=>q+s.attempted,0),firstTryLabs=studentStats.reduce((q,s)=>q+s.firstTry,0),retakeLabs=studentStats.reduce((q,s)=>q+s.detail.filter(x=>x.rows.length>1).length,0);
    const started=studentStats.filter(x=>x.attempted).length,completed=studentStats.filter(x=>x.complete).length;
    const allBest=studentStats.flatMap(s=>s.detail.filter(x=>x.rows.length).map(x=>x.best));
    const successAttempts=attempts.filter(x=>Number(x.score)>=90);
    const overall={students:members.length,started,completed,attempts:attempts.length,avgBest:avg(allBest),avgEff:avg(successAttempts.map(x=>x.efficiency)),avgTime:avg(successAttempts.map(x=>x.duration_seconds)),firstTryRate:pct(firstTryLabs,attemptedLabs),retakeRate:pct(retakeLabs,attemptedLabs)};
    const withData=labStats.filter(x=>x.students);
    const highest=withData.slice().sort((a,b)=>b.passRate-a.passRate||b.avgBest-a.avgBest)[0]||null;
    const lowest=withData.slice().sort((a,b)=>a.passRate-b.passRate||a.avgBest-b.avgBest)[0]||null;
    const mostRetaken=withData.slice().sort((a,b)=>b.retakes-a.retakes)[0]||null;
    const fastest=withData.filter(x=>x.avgTime).slice().sort((a,b)=>a.avgTime-b.avgTime)[0]||null;
    const lowestEff=withData.filter(x=>x.avgEff).slice().sort((a,b)=>a.avgEff-b.avgEff)[0]||null;

    const countWrong=(key)=>{const m=new Map();attempts.forEach(x=>{if(x[key]&&x[key]!==x.scenario_key)m.set(x[key],(m.get(x[key])||0)+1)});return[...m.entries()].sort((a,b)=>b[1]-a[1])};
    const wrongDiag=countWrong('diagnosis_key'),wrongRepair=countWrong('repair_key');
    const paths=new Map();sessions.filter(x=>Array.isArray(x.actions)&&x.actions.length).forEach(x=>{const p=x.actions.map(prettyKey).join(' → ');paths.set(p,(paths.get(p)||0)+1)});
    const commonPaths=[...paths.entries()].sort((a,b)=>b[1]-a[1]).slice(0,5);

    const bestFirstTry=Math.max(0,...studentStats.map(x=>x.firstTry)),firstTryLeaders=studentStats.filter(x=>x.firstTry===bestFirstTry&&bestFirstTry>0);
    const efficient=studentStats.filter(x=>x.avgEff).slice().sort((a,b)=>b.avgEff-a.avgEff||b.passed-a.passed)[0]||null;
    const fastAccurate=studentStats.filter(x=>x.avgTime&&x.passed).slice().sort((a,b)=>a.avgTime-b.avgTime||b.avgBest-a.avgBest)[0]||null;
    const improved=studentStats.filter(x=>x.improvement>0).slice().sort((a,b)=>b.improvement-a.improvement)[0]||null;
    const persistent=studentStats.filter(x=>x.persistence>0).slice().sort((a,b)=>b.persistence-a.persistence)[0]||null;
    const needsSupport=studentStats.filter(x=>x.attempted&& !x.complete).sort((a,b)=>a.passed-b.passed||b.retakes-a.retakes);

    const period=from||to?`${from||'Beginning'} to ${to||'Present'}`:'All Time';
    const actionItems=[];
    if(lowest)actionItems.push(`Reinforce ${lowest.title}; current mastery is ${lowest.passRate}% (${lowest.passed}/${lowest.students} students who attempted reached 90+).`);
    if(mostRetaken&&mostRetaken.retakes>0)actionItems.push(`Review ${mostRetaken.title} before the next activity; it generated the most retakes (${mostRetaken.retakes}).`);
    if(wrongDiag[0])actionItems.push(`Discuss why "${prettyKey(wrongDiag[0][0])}" is being selected incorrectly and require students to cite evidence before choosing a diagnosis.`);
    if(lowestEff)actionItems.push(`Model a more systematic troubleshooting sequence for ${lowestEff.title}; its successful-attempt efficiency averages ${lowestEff.avgEff}%.`);
    if(!actionItems.length)actionItems.push('Continue the current sequence and monitor mastery as more students complete the simulations.');

    const scoreClass=s=>s>=90?'ok':s>0?'warn':'muted';
    app.innerHTML=`<div class="row no-print"><div><div class="ey">WHOLE CLASS PERFORMANCE REPORT</div><h2>${esc(cur.name)}</h2><div class="muted">Code ${esc(cur.code)} · ${esc(period)}</div></div><div class="toolbar"><button id="backreport" class="btn">Back to Dashboard</button><button id="anonreport" class="btn">${anonymous?'Show Names':'Anonymous Names'}</button><button id="printreport" class="btn primary">Print / Save PDF</button><button id="csvreport" class="btn">Export CSV</button></div></div>

    <article class="card"><div class="ey">CLASS PROFILE & EXECUTIVE SUMMARY</div><h1 style="margin:8px 0 4px">SkillLab PH – Class Performance Report</h1><div class="muted">${esc(cur.name)} · ${esc(cur.code)} · ${esc(period)} · Generated ${new Date().toLocaleString('en-PH')}</div>
    <div class="grid g4" style="margin-top:16px"><div class="metric"><span class="muted">Active students</span><b>${overall.students}</b></div><div class="metric"><span class="muted">Started</span><b>${overall.started}</b></div><div class="metric"><span class="muted">Completed all ${catalog.length}</span><b>${overall.completed}</b><small class="muted">${pct(overall.completed,overall.students)}% completion</small></div><div class="metric"><span class="muted">Total attempts</span><b>${overall.attempts}</b></div></div>

    <article class="card"><div class="ey">TROUBLESHOOTING & MISTAKE ANALYSIS</div><div class="grid g2" style="margin-top:12px"><div><h3>Common wrong diagnoses</h3>${wrongDiag.length?wrongDiag.slice(0,6).map(([k,n])=>`<div class="notice" style="margin-top:7px"><b>${esc(prettyKey(k))}</b> · ${n} incorrect selection${n===1?'':'s'}</div>`).join(''):'<p class="muted">No wrong diagnosis data.</p>'}</div><div><h3>Common wrong repairs</h3>${wrongRepair.length?wrongRepair.slice(0,6).map(([k,n])=>`<div class="notice" style="margin-top:7px"><b>${esc(prettyKey(k))}</b> · ${n} incorrect selection${n===1?'':'s'}</div>`).join(''):'<p class="muted">No wrong repair data.</p>'}</div></div><h3>Most common troubleshooting paths</h3>${commonPaths.length?commonPaths.map(([p,n])=>`<div class="notice" style="margin-top:7px"><b>${esc(p)}</b><br><span class="muted">${n} session${n===1?'':'s'}</span></div>`).join(''):'<p class="muted">No troubleshooting path data.</p>'}</article>
    <article class="card"><div class="ey">TEACHER ACTION PLAN</div>${actionItems.map((x,i)=>`<div class="notice" style="margin-top:9px"><b>${i+1}.</b> ${esc(x)}</div>`).join('')}</article>`;

    document.querySelector('#backreport').onclick=load;
    document.querySelector('#anonreport').onclick=()=>{anonymous=!anonymous;render()};
    document.querySelector('#applyperiod').onclick=()=>{from=document.querySelector('#reportfrom').value;to=document.querySelector('#reportto').value;if(from&&to&&from>to)return alert('From date must be before To date.');render()};
    document.querySelector('#alltime').onclick=()=>{from='';to='';render()};
    document.querySelector('#printreport').onclick=()=>window.print();
    document.querySelector('#csvreport').onclick=()=>{
      const rows=[['Student',...catalog.map((a,i)=>`S${i+1}: ${a.title}`),'Labs Attempted','Labs Passed','Total Attempts','Retakes','Average Best','Average Efficiency','Average Successful Time Seconds','First-Try Mastery','Status'],...studentStats.map(s=>[s.name,...s.detail.map(x=>x.best||''),s.attempted,s.passed,s.totalAttempts,s.retakes,s.avgBest,s.avgEff,s.avgTime,s.firstTry,s.status])];
      const blob=new Blob([rows.map(r=>r.map(csvCell).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`${cur.code}-whole-class-report.csv`;a.click();URL.revokeObjectURL(url);
    };
  };
  render();
}

async function manageCall(body){
  const {data:{session}}=await sb.auth.getSession();
  if(!session?.access_token)return{error:'Teacher session expired. Please sign in again.'};
  const {data,error}=await sb.functions.invoke('skilllab-teacher-manage',{
    body,
    headers:{Authorization:'Bearer '+session.access_token}
  });
  if(error)return{error:error.message||'Management request failed.'};
  return data||{};
}
async function manageStudents(cur){
  app.innerHTML='<div class="card"><span class="spin"></span>Loading student management…</div>';
  const r=await manageCall({action:'roster',class_id:cur.id});
  if(r.error){
    app.innerHTML='<div class="card bad">'+esc(r.error)+'<br><button id="back" class="btn" style="margin-top:12px">Back</button></div>';
    document.querySelector('#back').onclick=load;
    return;
  }
  let students=r.students||[],filter='active',selected=null;

  const counts=()=>({
    active:students.filter(x=>x.status==='active'&&!x.is_test).length,
    archived:students.filter(x=>x.status==='archived').length,
    test:students.filter(x=>x.is_test).length,
    removed:students.filter(x=>x.status==='removed').length
  });

  const editor=x=>`<article id="student-editor" class="card">
    <div class="row">
      <div><div class="ey">STUDENT DETAILS</div><h3 style="margin:6px 0 0">${esc((x.display_name||showName(x.student_name)).toUpperCase())}</h3><div class="muted">${esc(x.email||'')}</div></div>
      <button id="closeedit" class="btn">Close</button>
    </div>
    <div class="grid g2" style="margin-top:14px">
      <div class="form">
        <label>Display name<input id="editname" maxlength="100" value="${esc((x.display_name||showName(x.student_name)).toUpperCase())}" style="text-transform:uppercase"></label>
        <label>Status<select id="editstatus">
          <option value="active" ${x.status==='active'?'selected':''}>Active</option>
          <option value="archived" ${x.status==='archived'?'selected':''}>Archived</option>
          <option value="removed" ${x.status==='removed'?'selected':''}>Removed from class</option>
        </select></label>
        <label><input id="edittest" type="checkbox" ${x.is_test?'checked':''}> Test / Sample account</label>
        <label>Teacher notes<textarea id="editnotes" rows="5" maxlength="2000">${esc(x.teacher_notes||'')}</textarea></label>
        <button id="savestudent" class="btn primary">Save Changes</button>
      </div>
      <div>
        <div class="notice"><b>Account email</b><br>${esc(x.email||'—')}</div>
        <div class="notice" style="margin-top:8px"><b>Registered name</b><br>${esc(x.auth_full_name||'—')}</div>
        <div class="notice" style="margin-top:8px"><b>Email confirmation</b><br>${x.email_confirmed_at?'Confirmed':'Not confirmed'}</div>
        <div class="notice" style="margin-top:8px"><b>Account created</b><br>${x.auth_created_at?new Date(x.auth_created_at).toLocaleString('en-PH'):'—'}</div>
      </div>
    </div>
    <hr style="border:0;border-top:1px solid var(--line);margin:20px 0">
    <div class="ey">PROGRESS CONTROLS</div>
    <p class="muted">Resetting one simulator removes this student's attempts, sessions and feedback for the selected simulator only.</p>
    <div class="toolbar">
      <select id="resetsim">${catalog.map((a,i)=>`<option value="${a.slug}">${String(i+1).padStart(2,'0')} · ${esc(a.title)}</option>`).join('')}</select>
      <button id="resetone" class="btn">Reset Simulator</button>
    </div>
    ${x.is_test?`<div class="notice bad" style="margin-top:18px"><b>Delete Test / Sample Data</b><p>This permanently removes this student's attempts, sessions, feedback and class membership for ${esc(cur.name)}. Their login account is kept.</p><button id="deletetest" class="btn">Delete Test Data</button></div>`:''}
  </article>`;

  const render=()=>{
    const n=counts();
    const shown=students.filter(x=>filter==='test'?x.is_test:filter==='all'?true:x.status===filter&&!x.is_test);
    app.innerHTML=`<div class="row">
      <div><div class="ey">STUDENT MANAGEMENT</div><h2>${esc(cur.name)}</h2><div class="muted">Edit roster details without changing saved student identity.</div></div>
      <div class="toolbar"><button id="addexisting" class="btn primary">+ Add Existing Student</button><button id="backdash" class="btn">Back to Dashboard</button></div>
    </div>
    <div class="grid g4">
      <div class="card metric"><span class="muted">Active</span><b>${n.active}</b></div>
      <div class="card metric"><span class="muted">Archived</span><b>${n.archived}</b></div>
      <div class="card metric"><span class="muted">Test / Sample</span><b>${n.test}</b></div>
      <div class="card metric"><span class="muted">Removed</span><b>${n.removed}</b></div>
    </div>
    <article class="card"><div class="toolbar">
      <button data-filter="active" class="btn">Active</button>
      <button data-filter="archived" class="btn">Archived</button>
      <button data-filter="test" class="btn">Test Accounts</button>
      <button data-filter="removed" class="btn">Removed</button>
      <button data-filter="all" class="btn">All</button>
    </div></article>
    ${selected?editor(selected):''}
    <article class="card">
      <div class="ey">CLASS ROSTER</div>
      ${shown.length?`<div class="table"><table><thead><tr><th>Student</th><th>Email</th><th>Joined</th><th>Status</th><th>Flags</th><th>Actions</th></tr></thead><tbody>${shown.map(x=>`<tr>
        <td><b>${esc((x.display_name||showName(x.student_name)).toUpperCase())}</b><div class="muted">${esc(x.auth_full_name||'')}</div></td>
        <td>${esc(x.email||'—')}</td>
        <td>${x.joined_at?new Date(x.joined_at).toLocaleString('en-PH'):'—'}</td>
        <td>${esc(x.status||'active')}</td>
        <td>${x.is_test?'<span class="pill warn">TEST</span>':''} ${x.possible_duplicate?'<span class="pill bad">POSSIBLE DUPLICATE</span>':''}</td>
        <td><button class="btn edit-student" data-id="${x.user_id}">View / Edit</button></td>
      </tr>`).join('')}</tbody></table></div>`:'<p class="muted">No students in this view.</p>'}
    </article>`;

    document.querySelector('#backdash').onclick=load;
    document.querySelector('#addexisting').onclick=async()=>{
      const email=prompt('Enter the registered SkillLab email address:');
      if(!email)return;
      const found=await manageCall({action:'find_existing_student',class_id:cur.id,email});
      if(found.error)return alert(found.error);
      const s=found.student;
      if(found.already_enrolled)return alert((s?.display_name||s?.full_name||'Student')+' is already enrolled in this class.');
      const ok=confirm('Add '+(s?.full_name||'this student')+'\n'+(s?.email||email)+'\n\nto '+cur.name+'?');
      if(!ok)return;
      const added=await manageCall({action:'add_existing_student',class_id:cur.id,email});
      if(added.error)return alert(added.error);
      const fresh=await manageCall({action:'roster',class_id:cur.id});
      if(fresh.error)return alert(fresh.error);
      students=fresh.students||students;
      filter='active';
      selected=students.find(x=>x.user_id===added.student?.user_id)||null;
      render();
      alert('Student added successfully.');
    };
    document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;selected=null;render()});
    document.querySelectorAll('.edit-student').forEach(b=>b.onclick=()=>{
      selected=students.find(x=>x.user_id===b.dataset.id)||null;
      render();
      setTimeout(()=>document.querySelector('#student-editor')?.scrollIntoView({behavior:'smooth',block:'start'}),50);
    });

    if(!selected)return;
    document.querySelector('#closeedit').onclick=()=>{selected=null;render()};
    document.querySelector('#editname').oninput=e=>e.target.value=e.target.value.toUpperCase();

    document.querySelector('#savestudent').onclick=async()=>{
      const btn=document.querySelector('#savestudent');
      btn.disabled=true;btn.textContent='Saving…';
      const res=await manageCall({
        action:'update_student',
        class_id:cur.id,
        user_id:selected.user_id,
        display_name:document.querySelector('#editname').value,
        teacher_notes:document.querySelector('#editnotes').value,
        is_test:document.querySelector('#edittest').checked,
        status:document.querySelector('#editstatus').value
      });
      if(res.error){btn.disabled=false;btn.textContent='Save Changes';return alert(res.error)}
      const fresh=await manageCall({action:'roster',class_id:cur.id});
      if(fresh.error)return alert(fresh.error);
      students=fresh.students||students;
      selected=students.find(x=>x.user_id===selected.user_id)||null;
      render();
    };

    document.querySelector('#resetone').onclick=async()=>{
      const a=document.querySelector('#resetsim');
      const title=a.options[a.selectedIndex].text;
      const confirmText=prompt('Reset '+title+' for '+(selected.display_name||showName(selected.student_name))+'? Type RESET to confirm.');
      if(confirmText!=='RESET')return;
      const res=await manageCall({
        action:'reset_simulator',
        class_id:cur.id,
        user_id:selected.user_id,
        activity_slug:a.value,
        confirm:'RESET'
      });
      if(res.error)return alert(res.error);
      alert('Simulator progress reset successfully.');
    };

    const del=document.querySelector('#deletetest');
    if(del)del.onclick=async()=>{
      const confirmText=prompt('This permanently deletes this TEST student data from this class. Type DELETE to confirm.');
      if(confirmText!=='DELETE')return;
      const res=await manageCall({
        action:'delete_test_data',
        class_id:cur.id,
        user_id:selected.user_id,
        confirm:'DELETE'
      });
      if(res.error)return alert(res.error);
      students=students.filter(x=>x.user_id!==selected.user_id);
      selected=null;
      render();
    };
  };

  render();
}

load();
